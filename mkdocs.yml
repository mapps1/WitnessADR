site_name: WitnessADR
site_description: Tamper-evident audit trail for AI agent decisions — open-source, self-hosted, hash-chained
site_url: https://witnessadr.github.io/witnessadr/
repo_url: https://github.com/witnessadr/witnessadr
repo_name: witnessadr/witnessadr
edit_uri: edit/main/docs/
copyright: "Copyright &copy; 2026 WitnessADR contributors — Apache 2.0"

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.share

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - Integration Guides:
    - LangChain: integration-guides/langchain.md
    - OpenAI: integration-guides/openai.md
    - Anthropic: integration-guides/anthropic.md
    - CrewAI: integration-guides/crewai.md
  - Reference:
    - Core API: reference/core.md
    - Storage: reference/storage.md
    - CLI: reference/cli.md
  - Specification: spec.md
  - FAQ: faq.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/witnessadr/witnessadr
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: Thanks for letting us know!
