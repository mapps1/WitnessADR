name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install packages
        run: |
          pip install \
            -e packages/core \
            -e packages/storage_sqlite \
            -e packages/cli \
            pytest \
            pytest-asyncio

      - name: Run core tests
        run: pytest packages/core/tests/ -v --tb=short

      - name: Run storage tests
        run: pytest packages/storage_sqlite/tests/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check packages/

  adapters:
    name: Adapter tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install packages + adapters
        run: |
          pip install \
            -e packages/core \
            -e packages/storage_sqlite \
            -e "packages/adapter_langchain[langchain]" \
            -e packages/adapter_openai \
            pytest \
            pytest-asyncio
      - name: Run adapter tests
        run: pytest packages/adapter_langchain/tests/ packages/adapter_openai/tests/ -v --tb=short
