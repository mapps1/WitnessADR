[project]
name = "witnessadr-cli"
version = "0.1.0"
description = "CLI for WitnessADR — init, verify, and export compliance bundles"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["ai-agents", "audit-log", "cli", "compliance", "tamper-evident"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/witnessadr/witnessadr"
Repository = "https://github.com/witnessadr/witnessadr"
Documentation = "https://witnessadr.github.io/witnessadr/"
Issues = "https://github.com/witnessadr/witnessadr/issues"

dependencies = [
    "witnessadr-core",
    "witnessadr-storage-sqlite",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
witnessadr = "witnessadr_cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witnessadr_cli"]
artifacts = ["src/witnessadr_cli/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
