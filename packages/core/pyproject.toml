[project]
name = "witnessadr-core"
version = "0.1.0"
description = "Core engine for WitnessADR — hash chain, Ed25519 signing, and independent verification"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["ai-agents", "audit-log", "tamper-evident", "compliance", "hash-chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/witnessadr/witnessadr"
Repository = "https://github.com/witnessadr/witnessadr"
Documentation = "https://witnessadr.github.io/witnessadr/"
Issues = "https://github.com/witnessadr/witnessadr/issues"
Changelog = "https://github.com/witnessadr/witnessadr/blob/main/CHANGELOG.md"

dependencies = [
    "jsonschema>=4.23",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witnessadr_core"]
artifacts = ["src/witnessadr_core/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
