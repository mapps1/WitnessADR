[project]
name = "witnessadr-adapter-langchain"
version = "0.1.0"
description = "LangChain callback handler adapter for WitnessADR"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["ai-agents", "audit-log", "langchain", "compliance", "tamper-evident"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "witnessadr-core",
    "witnessadr-storage-sqlite",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "langchain-core>=0.1",
]

[project.urls]
Homepage = "https://github.com/witnessadr/witnessadr"
Repository = "https://github.com/witnessadr/witnessadr"
Documentation = "https://witnessadr.github.io/witnessadr/"
Issues = "https://github.com/witnessadr/witnessadr/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witnessadr_adapter_langchain"]
artifacts = ["src/witnessadr_adapter_langchain/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
