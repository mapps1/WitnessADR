[project]
name = "witnessadr-storage-sqlite"
version = "0.1.0"
description = "SQLite storage adapter for WitnessADR"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["ai-agents", "audit-log", "sqlite", "compliance", "tamper-evident"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/witnessadr/witnessadr"
Repository = "https://github.com/witnessadr/witnessadr"
Documentation = "https://witnessadr.github.io/witnessadr/"
Issues = "https://github.com/witnessadr/witnessadr/issues"

dependencies = [
    "witnessadr-core",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witnessadr_storage_sqlite"]
artifacts = ["src/witnessadr_storage_sqlite/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
